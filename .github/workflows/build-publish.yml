name: Build

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      force_thunderstore:
        description: Force re-publishing to Thunderstore
        required: true
        default: false
        type: boolean
      force_nuget:
        description: Force re-publishing to NuGet
        required: true
        default: false
        type: boolean
      force_nexus:
        description: Force re-publishing to Nexus Mods
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Check that all language files are valid and contain the same keys
  localization-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Check language files
        run: python3 scripts/check_language_files.py

  # Build the mod and create artifacts for publishing
  build:
    runs-on: ubuntu-latest
    outputs:
      thunderstore-artifact-id: ${{ steps.thunderstore-artifact.outputs.artifact-id }}
      nuget-artifact-id: ${{ steps.nuget-artifact.outputs.artifact-id }}

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - name: Build
        run: dotnet build -c Release --verbosity normal
      - name: Pack
        run: dotnet pack -o nuget/
      - name: Upload thunderstore artifact
        id: thunderstore-artifact
        uses: actions/upload-artifact@v7
        with:
          path: thunderstore/dist/*.zip
          archive: false
      - name: Upload nuget artifact
        id: nuget-artifact
        uses: actions/upload-artifact@v7
        with:
          path: nuget/*.nupkg
          archive: false

  # Get the version from the project file and check if it is a new version
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is-new-version: ${{ !fromJSON(steps.needs-release.outputs.exists || 'true') }}

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.x
      - name: Get Version
        id: version
        run: |-
          VERSION=$(dotnet build SaveFileManagerMod.csproj -getProperty:Version)
          echo Version is $VERSION
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: Check if release needed
        id: needs-release
        uses: mukunku/tag-exists-action@v1.7.0
        with:
          tag: v${{ steps.version.outputs.version }}
      - name: Ensure PR version is new
        if: github.event_name == 'pull_request' && steps.needs-release.outputs.exists == 'true'
        run: |
          echo "::error file=Directory.Build.props,line=14::Version ${{ steps.version.outputs.version }} already exists. Please update the version in Directory.Build.props to a new version."
          exit 1

  # Check which secrets are set
  secret-check:
    runs-on: ubuntu-latest
    outputs:
      has-nuget-secret: ${{ secrets.NUGET_API_KEY != '' }}
      has-thunderstore-secret: ${{ secrets.THUNDERSTORE_API_KEY != '' }}
      has-nexus-secret: ${{ secrets.NEXUSMODS_API_KEY != '' && vars.NEXUSMODS_FILE_ID != '' }}
    steps:
      - run: |
          [[ -n "${{ secrets.NUGET_API_KEY }}" ]] && echo "NUGET_API_KEY is set" || echo "NUGET_API_KEY is not set"
          [[ -n "${{ secrets.THUNDERSTORE_API_KEY }}" ]] && echo "THUNDERSTORE_API_KEY is set" || echo "THUNDERSTORE_API_KEY is not set"
          [[ -n "${{ secrets.NEXUSMODS_API_KEY }}" ]] && echo "NEXUSMODS_API_KEY is set" || echo "NEXUSMODS_API_KEY is not set"
          [[ -n "${{ vars.NEXUSMODS_FILE_ID }}" ]] && echo "NEXUSMODS_FILE_ID is set" || echo "NEXUSMODS_FILE_ID is not set"

  # Publish to https://thunderstore.io/c/hollow-knight-silksong
  release-thunderstore:
    needs:
      - localization-check
      - build
      - get-version
      - secret-check
    runs-on: ubuntu-latest
    if: |
      needs.secret-check.outputs.has-thunderstore-secret == 'true' && (
        (github.event_name == 'push' && needs.get-version.outputs.is-new-version == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.force_thunderstore == 'true')
      )
    env:
      THUNDERSTORE_API_KEY: ${{ secrets.THUNDERSTORE_API_KEY }}

    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Restore tools
        run: dotnet tool restore
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.thunderstore-artifact-id }}
          path: thunderstore/dist
          skip-decompress: true
      - name: Publish to Thunderstore
        run: |-
          dotnet tcli publish \
            --config-path thunderstore/thunderstore.toml \
            --file thunderstore/dist/*.zip \
            --token $THUNDERSTORE_API_KEY

  # Publish to https://nexusmods.com/games/hollowknightsilksong/
  release-nexus:
    needs:
      - localization-check
      - build
      - get-version
      - secret-check
    runs-on: ubuntu-latest
    if: |
      needs.secret-check.outputs.has-nexus-secret == 'true' && (
        (github.event_name == 'push' && needs.get-version.outputs.is-new-version == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.force_nexus == 'true')
      )
    env:
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.thunderstore-artifact-id }}
          path: thunderstore/dist
          skip-decompress: true
      - name: Publish to Nexus Mods
        uses: Nexus-Mods/upload-action@v1.0.0-beta.9
        with:
          api_key: ${{ env.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: thunderstore/dist/mich101mich-SaveFileManagerMod-${{ needs.get-version.outputs.version }}.zip
          version: ${{ needs.get-version.outputs.version }}
          display_name: SaveFileManagerMod ${{ needs.get-version.outputs.version }}
          category: main
          archive_existing_version: true
          primary_mod_manager_download: true
          allow_mod_manager_download: true
          update_mod_version: true

  # Publish to NuGet so that other mods can depend on it in CI
  release-nuget:
    needs:
      - localization-check
      - build
      - get-version
      - secret-check
    runs-on: ubuntu-latest
    if: |
      needs.secret-check.outputs.has-nuget-secret == 'true' && (
        (github.event_name == 'push' && needs.get-version.outputs.is-new-version == 'true') ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.force_nuget == 'true')
      )
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.x
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.nuget-artifact-id }}
          path: nuget/
      - name: Publish to NuGet
        run: |-
          dotnet nuget push nuget/*.nupkg \
            --api-key $NUGET_API_KEY \
            --source https://api.nuget.org/v3/index.json

  # Publish to GitHub releases to keep release history on the repository (needed for this workflow to work properly
  # but is also nice for multiple other reasons such as auto-tagging *after* a build success)
  release-github:
    needs:
      - localization-check
      - build
      - get-version
      - secret-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && needs.get-version.outputs.is-new-version == 'true'

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.thunderstore-artifact-id }}
          path: thunderstore/dist
          skip-decompress: true
      - name: Download NuGet artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.nuget-artifact-id }}
          path: nuget/
      - name: Generate attestation
        id: attest
        uses: actions/attest@v4
        with:
          subject-path: |
            thunderstore/dist/*.zip
            nuget/*.nupkg
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          tag_name: v${{ needs.get-version.outputs.version }}
          body: |
            Build attested at ${{ steps.attest.outputs.attestation-url }}
          files: |
            thunderstore/dist/*.zip
